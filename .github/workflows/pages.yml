name: Test and deploy Quadratic Studio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  ai-browser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run build
      - run: python -m pip install playwright==1.58.0
      - run: python -m playwright install --with-deps chromium
      - name: Run the actual browser language model on all three levels
        run: python tests/live_ai.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-ai-browser-results
          path: test-results/
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
  verify-live-site:
    runs-on: ubuntu-latest
    needs: [deploy, ai-browser-check]
    timeout-minutes: 12
    env:
      QUADRATIC_TEST_URL: ${{ needs.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.58.0
      - run: python -m playwright install --with-deps chromium
      - name: Select installed Chromium
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              print('BROWSER_EXECUTABLE=' + p.chromium.executable_path)
          PY
      - name: Verify the live website interactions and report
        run: |
          python tests/browser.py
          echo "::notice title=Live site functional checks::All 13 browser checks passed on $QUADRATIC_TEST_URL"
      - name: Verify real AI inference on the live website
        run: python tests/live_ai.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-website-results
          path: test-results/
